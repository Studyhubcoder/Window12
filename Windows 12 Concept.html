const chip=u=>`<div style="position:absolute;bottom:8px;right:8px;background:var(--gs);border:1px solid var(--line);padding:5px 10px;border-radius:10px;font-size:12px;z-index:2">Blank? Some sites refuse to be embedded. <a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent)">Open in new tab</a></div>`;
function regWeb(){Object.keys(APPS).filter(k=>APPS[k].web).forEach(k=>{delete APPS[k];delete BUILD[k];delete I[k]});
 ST.sys.web.forEach(x=>{const k='web_'+x.id;I[k]=`<rect x="3" y="3" width="26" height="26" rx="7" fill="${x.c}"/><text x="16" y="22.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Segoe UI,sans-serif">${esc(x.n.slice(0,1).toUpperCase())}</text>`;
  APPS[k]={n:x.n,i:k,w:900,h:540,web:x.u};BUILD[k]=(w,b)=>webapp(w,b,x.u)})}
function webapp(w,b,url){b.innerHTML=`<div class="bar"><button data-c="re" aria-label="Reload">⟳</button><input class="search" style="flex:1;min-width:140px" aria-label="Address" value="${esc(url)}"><button class="sb" data-c="tab">Open in new tab</button></div><div class="pgc" style="position:relative;flex:1"></div>`;
 let cur=url;const pg=$('.pgc',b),load=()=>{pg.innerHTML=online()?`<iframe src="${esc(toEmbed(cur))}" title="Web app" ${FRAME}></iframe>${chip(cur)}`:offPage()};
 b.onclick=e=>{const c=e.target.closest('[data-c]');if(!c)return;const a=c.dataset.c;if(a==='re')load();else if(a==='tab')link(cur);else if(a==='wifi')open('set',{page:'net'})};
 b.onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('.search')){let v=e.target.value.trim();if(!/^https?:\/\//i.test(v))v='https://'+v;cur=v;load()}};w.api.render=load;load()}
BUILD.youtube=(w,b)=>{const vids=[['Big Buck Bunny','YE7VzlLtp-4'],['Sintel','eRsGyueVLvQ'],['Tears of Steel','R6MlUcmOul8']];
 b.innerHTML=`<div class="bar"><input class="search" style="flex:1;min-width:150px" placeholder="Paste a YouTube link, video ID or playlist" aria-label="YouTube link"><button class="sb pri" data-c="play">Play</button><button class="sb" data-c="tab">Open YouTube</button></div><div class="split"><div class="pgc" style="flex:1;background:#000;position:relative;min-width:0"></div><nav class="side" style="width:170px;border-left:1px solid var(--line);border-right:0"><div class="sec" style="margin-top:0">Try these</div>${vids.map(v=>`<button data-v="${v[1]}">${esc(v[0])}</button>`).join('')}</nav></div><div class="status">Plays YouTube videos inside this window. Search needs the real site, so plain words open YouTube in a new tab.</div>`;
 const pg=$('.pgc',b),inp=$('.search',b),play=u=>{if(!online()){pg.innerHTML='<div style="color:#fff;padding:20px">'+esc(netText())+'. Turn on internet access to play videos.</div>';return}pg.innerHTML=`<iframe src="${esc(u)}" title="YouTube player" ${FRAME}></iframe>`},
 emb=s=>{s=s.trim();const l=s.match(/[?&]list=([\w-]+)/),v=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||(/^[\w-]{11}$/.test(s)?[0,s]:null);if(v)return'https://www.youtube-nocookie.com/embed/'+v[1]+'?autoplay=1&rel=0'+(l?'&list='+l[1]:'');if(l)return'https://www.youtube-nocookie.com/embed/videoseries?list='+l[1];return null};
 const go=()=>{const s=inp.value.trim();if(!s)return;const u=emb(s);u?play(u):link('https://www.youtube.com/results?search_query='+encodeURIComponent(s))};
 b.onclick=e=>{const c=e.target.closest('[data-c]'),v=e.target.closest('[data-v]');if(v)return play('https://www.youtube-nocookie.com/embed/'+v.dataset.v+'?autoplay=1&rel=0');if(c)c.dataset.c==='play'?go():link('https://www.youtube.com')};
 inp.onkeydown=e=>{if(e.key==='Enter')go()};pg.innerHTML='<div style="color:#fff;padding:20px">Paste a link above or pick a video on the right.</div>'};
A.webadd=()=>dlg('Website address','https://',u=>{u=u.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;let h;try{h=new URL(u).hostname.replace(/^www\./,'')}catch(e){return notify('Invalid address','Enter a full web address.')}
 dlg('App name',h,n=>{n=(n.trim()||h).slice(0,20);ST.sys.web.push({id:Date.now().toString(36),n,u,c:WCOL[ST.sys.web.length%6]});regWeb();renderPins();tasks();save();settingsRender();notify(n,'Added to Start')})});
A.webrm=d=>{const i=ST.sys.web.findIndex(x=>x.id===d.id);if(i<0)return;Object.values(W).filter(x=>x.k==='web_'+d.id).forEach(x=>close(x.id));ST.sys.web.splice(i,1);regWeb();renderPins();tasks()};
const _pa=P.apps;P.apps=()=>_pa()+'<h3>Websites as apps</h3>'+ST.sys.web.map(x=>srow(`<span style="display:flex;gap:10px;align-items:center">${ic('web_'+x.id,26)}${esc(x.n)}</span>`,esc(x.u),btn('openapp','Open','','data-k="web_'+x.id+'"')+btn('webrm','Remove','',`data-id="${x.id}"`))).join('')+srow('Add a website as an app','Any site opens in its own window',btn('webadd','Add','pri'));
/* ---------- Edge / Chrome with in-window pages ---------- */
const BMK2=[['Gmail','https://mail.google.com'],['YouTube','https://www.youtube.com'],['Maps','https://www.openstreetmap.org/export/embed.html?bbox=68%2C6%2C98%2C36&layer=mapnik'],['GitHub','https://github.com'],['Wikipedia','https://en.wikipedia.org'],['News','https://www.bbc.com/news']];
function toEmbed(u){const m=u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);return m?'https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1&rel=0':u}
function mkBrowser(kind){return(w,b)=>{let tabs=[{u:'ntp'}],cur=0,shelf=[];const eng=kind==='chrome'?'https://www.google.com/search?q=':'https://www.bing.com/search?q=';
 b.innerHTML=`<div class="tabs"></div><div class="bar"><button data-c="back" aria-label="Back">←</button><button data-c="reload" aria-label="Reload">⟳</button><input class="search omni" style="flex:1;min-width:140px" placeholder="Search or type a URL" aria-label="Address"><button data-c="go" class="pri">Go</button><button data-c="prof" aria-label="Profile">${USER?av(USER,22):''}</button></div><div class="bk">${BMK2.map(([n,u])=>`<a href="#" data-go="${esc(u)}">${n}</a>`).join('')}</div><div class="pgc"></div><div class="shelf"></div>`;
 const ttl=t=>t.u==='ntp'?'New tab':t.u==='down'?'Downloads':t.u==='samples'?'Sample files':(()=>{try{return new URL(t.orig||t.url).hostname}catch(e){return t.url}})(),k2=(n,v)=>v.t==='d'?'folder':v.t==='i'?'photo':'note';
 function render(){const t=tabs[cur],pg=$('.pgc',b);$('.tabs',b).innerHTML=tabs.map((x,i)=>`<div class="tab ${i===cur?'on':''}" data-t="${i}"><span>${esc(ttl(x))}</span><button data-x="${i}" aria-label="Close tab">✕</button></div>`).join('')+'<button class="tab" data-c="nt" aria-label="New tab">＋</button>';$('.omni',b).value=t.u==='web'?(t.orig||t.url):'';
  if(t.u==='ntp')pg.innerHTML=`<div class="bw"><h1 style="font-weight:300;margin:10px 0 18px">${kind==='chrome'?'Chrome':'Edge'} · New tab</h1><input class="search" id="ntq" style="max-width:480px" placeholder="Search the web or type a URL" aria-label="Search"><div class="tiles">${BMK2.map(([n,u])=>`<a href="#" data-go="${esc(u)}">${n}</a>`).join('')}<a href="#" data-go="chrome://downloads">Downloads</a><a href="#" data-go="chrome://samples">Sample files</a></div></div>`;
  else if(t.u==='down'){const e=Object.entries(node(['Downloads']).c);pg.innerHTML=`<div class="pad"><h2 style="margin:0 0 10px">Downloads</h2><div style="display:flex;gap:8px;margin-bottom:10px"><label class="sb pri" style="cursor:pointer">Import files from this computer<input type="file" multiple hidden></label><button class="sb" data-c="folder">Open folder</button></div>`+(e.length?e.map(([n,v])=>srow(`<span style="display:flex;gap:10px;align-items:center">${ic(k2(n,v),24)}${esc(n)}</span>`,fmt(sizeOf(v)),'')).join(''):'<p style="color:var(--ink2)">No downloads yet.</p>')+'</div>'}
  else if(t.u==='samples')pg.innerHTML=`<div class="pad"><h2 style="margin:0 0 6px">Sample files</h2><p style="color:var(--ink2)">Built-in files that show how downloads work. They save to your Downloads folder.</p>`+SAMPLES.map(n=>srow(esc(n),'',`<button class="sb pri" data-dl="${n}">Download</button>`)).join('')+'</div>';
  else pg.innerHTML=online()?`<iframe src="${esc(t.url)}" title="Web page" ${FRAME}></iframe>${chip(t.orig||t.url)}`:offPage()}
 function drawShelf(){$('.shelf',b).innerHTML=shelf.slice(-4).map(i=>`<div class="dli"><b>${esc(i.n)}</b><div style="color:var(--ink2)">${i.p>=100?'Done':Math.floor(i.p)+'%'}</div><div class="pbar"><i style="width:${i.p}%"></i></div></div>`).join('')}
 function dl(n){if(!online())return notify('Download failed','No internet connection.');const it={n,p:0};shelf.push(it);const iv=setInterval(()=>{it.p+=12+Math.random()*18;if(it.p>=100){it.p=100;clearInterval(iv);put(['Downloads'],n,mkSample(n));notify('Download complete',n+' saved to Downloads')}drawShelf()},250);drawShelf()}
 function go(v){v=v.trim();if(!v)return;if(/^(chrome|edge|about):\/\/downloads/i.test(v))tabs[cur]={u:'down'};else if(/^(chrome|edge|about):\/\/samples/i.test(v))tabs[cur]={u:'samples'};
  else{const u=/^https?:\/\//i.test(v)?v:/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v)?'https://'+v:eng+encodeURIComponent(v);if(/^https?:\/\/(www\.|m\.)?youtube\.com\/?(\?.*)?$/i.test(u)){open('youtube');return}tabs[cur]={u:'web',url:toEmbed(u),orig:u}}render()}
 b.onclick=e=>{const x=e.target.closest('[data-x]');if(x){tabs.splice(+x.dataset.x,1);if(!tabs.length)tabs=[{u:'ntp'}];cur=Math.min(cur,tabs.length-1);render();return}
  const t=e.target.closest('[data-t]');if(t){cur=+t.dataset.t;render();return}const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
  const d=e.target.closest('[data-dl]');if(d)return dl(d.dataset.dl);const c=e.target.closest('[data-c]');if(!c)return;const a=c.dataset.c;
  if(a==='go')go($('.omni',b).value);else if(a==='nt'){tabs.push({u:'ntp'});cur=tabs.length-1;render()}else if(a==='reload')render();else if(a==='back'){tabs[cur]={u:'ntp'};render()}
  else if(a==='folder')open('explorer',{path:['Downloads']});else if(a==='wifi')open('set',{page:'net'});
  else if(a==='prof')notify('Profile: '+(USER?USER.name:''),'Google sign-in must be done on the real site. Gmail may refuse to load in a window; use Open in new tab.')};
 b.onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('.omni,#ntq'))go(e.target.value)};b.onchange=e=>{if(e.target.type==='file')importFiles(e.target.files)};
 w.api.render=()=>{if(tabs[cur].u==='down')render()};render()}}

async function boot(){await DB.open();const s=await DB.get('state'),d=defSys();
 if(s&&s.users){ST=s;ST.users.forEach(u=>{if(Array.isArray(u.face))u.face=null});const old=s.sys||{};ST.sys=Object.assign(d,old);for(const k of['upd','sec','wifi','bt'])ST.sys[k]=Object.assign(defSys()[k],old[k]);if(!Array.isArray(ST.sys.web))ST.sys.web=defSys().web;ST.sys.wifi.on=ST.sys.wifi.on?1:0}
 else ST={users:[],sys:d};
 const u=ST.sys.upd;if(u.state==='installing')u.state='available';if(u.state==='checking')u.state='idle';
 regWeb();PIN.splice(0,PIN.length,'explorer','browser','youtube','notepad','calc','paint','term','set',...['chrome','code'].filter(k=>ST.sys.inst.includes(k)));
 renderPins();tasks();apply();tray();qsRender();tick();setInterval(tick,1000);setInterval(syncBt,1500);batInit();
 ST.users.length?lock():oobe()}
boot();
